<!DOCTYPE html>

<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {

      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #141414;

      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-size: clamp(2rem, 8vw, 4rem);
      margin: 0 0 8px;
    }
    p { color: #f2c200; margin: 0; }

<body>
  <main>
    <div class="bar"></div>

    <p>Jeff Gliick · Games, projects and art · Coming soon</p>
